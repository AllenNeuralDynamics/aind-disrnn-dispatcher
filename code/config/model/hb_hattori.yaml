# Hierarchical Bayesian Hattori2019 baseline: partial pooling across a subject's sessions,
# with a population level so held-out subjects can be scored the way the neural models are.
#
# Runs through the same entrypoint as every other model, so HPC and Beaker need no
# HB-specific plumbing:
#   python -m run_hpc data=mice_snapshot_scaling model=hb_hattori data.subject_ratio=0.049
#
# The model itself lives in aind-dynamic-foraging-models and knows nothing about this stack.
# Design rationale: that package's docs/design-decisions.md, and the dispatcher's ADRs 1-6.
type: hb

_target_: model_trainers.hb_trainer.HBTrainer

architecture:
  multisubject: true          # the hierarchy is over subjects; single-subject is not a mode
output_dir: ${oc.env:BFM_OUTPUT_DIR,${oc.env:DISRNN_OUTPUT_DIR,/results}}

# ── Estimator ────────────────────────────────────────────────────────────
# one_stage infers population, subject and session levels jointly. two_stage fits each
# subject alone and then a population over those posteriors: it matches one_stage to within
# 0.00027 on held-out likelihood but costs ~5x the compute, so it is a fallback for scales
# where the joint fit will not converge, not the default.
estimator: one_stage

# ── Sampler ──────────────────────────────────────────────────────────────
# Warmup was 500 through the first completed D30 rung
# (Beaker 01M1KKHNKZ67YGVVGRDH2G009B), which FAILED all three convergence gates:
# r_hat 1.0255 (gate < 1.01), min bulk ESS 177 (gate >= 400), 8 divergences in 2000 draws
# (gate 0). The failures were concentrated on the group-scale layer --
# log_sigma_spread[forget_rate_unchosen] at r_hat 1.024 / ESS 205, and the subject-level
# mu_p / log_sigma at r_hat ~1.025 / ESS ~180 -- which is a funnel signature rather than
# bad luck. Population means were borderline (worst 1.0118).
#
# Raising warmup first, and only warmup, is the principled move rather than a guess:
# divergences are curvature the integrator cannot follow, so more DRAWS do not fix them,
# and adaptation quality cannot be recovered after the fact. The Stan reference for this
# same likelihood (AllenNeuralDynamics/aind_stan_fit_sim) used 2500 warmup at Stan's
# DEFAULT adapt_delta of 0.8 -- i.e. evidence that this posterior is tractable with default
# geometry given enough warmup. 2000 buys most of that at 4/5 the cost.
num_warmup: 2000
num_samples: 500
num_chains: 4                 # vectorized across chains; they share one device

# Integrator geometry, previously hardcoded NumPyro defaults and unreachable from config.
# target_accept_prob is the same quantity as Stan's adapt_delta. These stay at the defaults
# here: the point of the warmup change is to test whether warmup ALONE clears the gates, and
# raising both at once would confound the two. If divergences survive 2000 warmup, 0.9 is
# the next step and needs no code change now.
target_accept_prob: 0.8
max_tree_depth: 10

# Session-level parameters and per-session log likelihoods. Off by default because they are
# the bulk of the artifact; ON here because production rungs must be replayable: the
# decision-variable trajectories (#115) and PSIS-LOO/WAIC both need them, and a multi-hour
# fit that ships without them cannot be replayed at all -- it has to be re-fit. The first
# D30 was launched without them, which is why it has no DV trajectories.
save_session_sites: true

beta_max: 10.0                # upper bound of softmax_inverse_temperature, per the paper

# Both NUTS keys -- the population fit and the held-out adaptation/scoring draws -- derive
# from this. Without it HBTrainer gets seed=None and ModelTrainer falls back to
# int(time.time()), so the rung cannot be reproduced from its own config. Every other model
# config in this group wires it the same way.
seed: ${seed}

# ── Held-out scoring ─────────────────────────────────────────────────────
# Two different things are reported, and they are not on the same scale of evidence.
#
# The MATCHED rung conditions on **all** of each held-out subject's train sessions -- the
# same split, from the same function, that the GRU's auto_heldout_finetune adapts on and
# the per-mouse MLE baseline fits. Measured on the real cohort that is a median of 14
# context sessions, up to 35, with 87% of subjects above 8. This is the number that goes
# to heldout/eval_likelihood, and the only one comparable with the GRU.
#
# The k SWEEP caps context at k sessions. Every rung is therefore *less* conditioned than
# matched -- k=8 is roughly half the context for a typical subject, not an approximation
# of it -- and k=0 is zero-shot, a different claim entirely. The sweep traces how quickly
# a new subject's own data displaces the cohort prior; it does not compete with the GRU.
#
# The eval half is never touched by either, so all rungs score identical targets.
eval_every_n: 2               # must match data.eval_every_n
few_shot_k: [0, 1, 2, 4, 8]

# Posterior draws, diagnostics and provenance. A cohort fit costs hours; without this every
# later question -- a new rung, a calibration check, a figure -- means refitting.
artifact_dir: ${oc.env:BFM_OUTPUT_DIR,${oc.env:DISRNN_OUTPUT_DIR,/results}}/hb_artifacts

# Keep the session level in the persisted fit, not just the population and subject levels
# (save_fit's include_session_sites, which defaults to off). On the one_stage route this
# adds `session_log_lik`, draws x subjects x sessions -- what WAIC, PSIS-LOO and any
# per-session comparison need. It is the bulk of the artifact and nothing in the run reads
# it back, which is why it is tempting to omit; but a site exists only while the sampler
# does, so a fit that ships without it can be recovered only by re-fitting, and this fit
# costs hours. On for every production rung; turn it off for a throwaway.
#
# Not sufficient on its own for a per-session latent decision variable, verified against a
# sampler run rather than the site names: hattori2019_three_level registers exactly one
# session-level site, `session_log_lik`. The five per-session parameters that
# artifacts.SESSION_SITES names are sites only in the two-level model, and `theta_raw`
# (draws x subjects x sessions x 5), the offsets those parameters are computed from, is in
# no keep list. A latent-trajectory replay therefore needs save_fit's keep list widened as
# well -- tracked on dispatcher #115.
save_session_sites: true

run_name_component: hb_${.estimator}
