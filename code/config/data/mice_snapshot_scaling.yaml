# Mice-snapshot data config for the GRU scaling study (W&B project: mice_scaling).
# Full subject pool (subject_ratio 1.0 per curriculum), all-stage trials,
# batch_size 2048. Edit this file to change the data side of the experiment.
type: mice_snapshot

_target_: data_loaders.mice.MiceSnapshotDatasetLoader

# ── Subject-selection pipeline ───────────────────────────────────────────
subject_ids: null             # non-null list bypasses the selection pipeline
min_sessions: 10
heldout_every_n: 5            # reserve every 5th ranked subject (~20%) as heldout
subject_ratio:                # per-curriculum fraction of the ~80% train pool
  Coupled Baiting: 1.0
  Uncoupled Baiting: 1.0
  Uncoupled Without Baiting: 1.0
subject_sample_seed: ${seed}

# ── Held-out test subject evaluation ─────────────────────────────────────
test_subject_ids: null
heldout_example_sessions_per_subject: 1
train_example_sessions_per_subject: 1
eval_example_sessions_per_subject: 1
example_max_subjects: 2

# Pin reads to a dated database snapshot instead of the live (growing) database,
# so the exact same sessions/subjects are selected on every run. null -> live.
snapshot: "20260603"

# ── Trial / feature processing ───────────────────────────────────────────
mature_only: false            # all-stage trials (does NOT affect subject selection)
curricula:
  - Coupled Baiting
  - Uncoupled Baiting
  - Uncoupled Without Baiting
ignore_policy: exclude
features: null                # null -> library defaults (prev choice, prev reward)

# ── Batching / splitting ─────────────────────────────────────────────────
eval_every_n: 2
batch_size: 2048
batch_mode: random
multisubject: true

seed: ${seed}

# ── Optional timing inputs: previous-trial reaction time + lick counts ────
# When enabled, the loader derives per-trial reaction time and post-go-cue lick
# counts from the database and APPENDS them to the observation vector as
# previous-trial inputs, alongside prev-choice + prev-reward. obs_size widens
# automatically from the tensor width, so no model-block change is needed
# (2 -> 5 with all three features on). Encoding: log(reaction_time) and raw
# left/right counts, both standardized by default.
# Implementation + rationale: aind-dynamic-foraging-bfm-wrapper code/utils/trial_timing_features.py
# and TRAINING.md §6 "Optional timing inputs".
timing_features:
  enabled: false               # master switch; false -> identical to the base model
  reaction_time: true          # include prev log reaction time (+1 feature)
  lick_counts: true            # include prev n_lick_left + n_lick_right (+2 features)
  lick_window_s: 2.0           # window (s) after go-cue over which licks are counted
  standardize: true            # center/scale continuous channels by fixed population
                               # constants; keep true for disRNN (its bottleneck KL is
                               # quadratic in input magnitude, and per-channel sigma
                               # readouts must be comparable across inputs)
  shuffle: false               # CONTROL ARM: permute raw response cols within session
  shuffle_seed: -1             # -1 = derive from the run seed (so seed replicates of
                               # the shuffled arm get DIFFERENT permutations)

# Your template for the data part of the W&B run name
run_name_component: mice_snapshot
