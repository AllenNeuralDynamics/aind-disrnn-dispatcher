name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # cache: pip looks for requirements.txt / pyproject.toml by default and
          # errors out when neither exists, so point it at ours explicitly.
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # ADR-0007's boundary, enforced. Self-test first: a checker that cannot
      # fail is worse than none, because it reports success either way.
      - name: Guardrail self-test
        run: python scripts/check_project_identity.py --self-test

      - name: Project-identity guardrail
        run: python scripts/check_project_identity.py

      - name: Tests
        run: python -m unittest discover -s tests -t . -v
